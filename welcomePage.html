<!DOCTYPE html>
<html>
<head>
  <title>Convoy Sign Up</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<h1 class="page-title">Convoy</h1>

<img src="Convoy.jpg" class="rounded-circle" alt="Cinque Terre" id="top-right-image">

<div class="signup-container">

  <h2>Sign Up for Convoy</h2>
  <p>Please fill in this form to create an account.</p>
  <hr>

  <form>

    <label><b>Email</b></label>
    <input type="email" placeholder="Enter Email" id="email" required>

    <label><b>Password</b></label>
    <input type="password" placeholder="Enter Password" id="psw" required>

    <label><b>Repeat Password</b></label>
    <input type="password" placeholder="Repeat Password" id="psw-repeat" required>

    <label class="remember">
      <input type="checkbox" checked="checked" name="remember">
      Remember me
    </label>

    <p>
      By creating an account you agree to our 
      <a href="terms&Privacy.html">Terms & Privacy</a>
    </p>

    <div class="button-group">
      <button type="button" class="cancelbtn">Cancel</button>

      <button type="button" class="signupbtn" onclick="handleSignup()">
        Sign Up
      </button>
    </div>

  </form>

</div>

<script>
function handleSignup() {
  const email = document.getElementById("email");
  const password = document.getElementById("psw").value;
  const repeatPassword = document.getElementById("psw-repeat").value;

  // Check email validity using browser validation
  if (!email.checkValidity()) {
    alert("Please enter a valid email address.");
    return;
  }

  // Check password match
  if (password !== repeatPassword) {
    alert("Passwords do not match!");
    return;
  }

  // If everything is valid → redirect
  window.location.href = "websitefrontEnd.html";
}
</script>

</body>
</html>
